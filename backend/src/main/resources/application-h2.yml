spring:
  datasource:
    url: jdbc:h2:mem:sentineldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS tenancy\;CREATE SCHEMA IF NOT EXISTS identity\;CREATE SCHEMA IF NOT EXISTS patient\;CREATE SCHEMA IF NOT EXISTS clinical\;CREATE SCHEMA IF NOT EXISTS pharmacy\;CREATE SCHEMA IF NOT EXISTS scheduling\;CREATE SCHEMA IF NOT EXISTS documents\;CREATE SCHEMA IF NOT EXISTS insurance\;CREATE SCHEMA IF NOT EXISTS billing\;CREATE SCHEMA IF NOT EXISTS consent\;CREATE SCHEMA IF NOT EXISTS security\;CREATE SCHEMA IF NOT EXISTS terminology\;CREATE SCHEMA IF NOT EXISTS audit\;CREATE SCHEMA IF NOT EXISTS imaging\;CREATE SCHEMA IF NOT EXISTS laboratory\;CREATE SCHEMA IF NOT EXISTS procedures
    driverClassName: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
